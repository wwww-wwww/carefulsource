[project]
name = "vscarefulsource"
version = "3"
requires-python = ">3.12"
readme = "README.md"
dependencies = ["vapoursynth>=74"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "packaging", "meson-python", "meson", "ninja", "wheel", "vapoursynth>=74"]

[tool.meson-python]
allow-windows-internal-shared-libs = true

[tool.meson-python.args]
setup = ["-Dpy_ext=false"]

[tool.hatch.build.targets.wheel]
include = ["vapoursynth/plugins"]
artifacts = [
    "vapoursynth/plugins/*.dylib",
    "vapoursynth/plugins/*.so",
    "vapoursynth/plugins/*.dll",
]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "subprojects/*.wrap",
  "subprojects/lcms2-*",
  "subprojects/libjpeg-turbo-*",
  "subprojects/libpng-*",
  "subprojects/zlib-*",
  "meson.build",
  "meson.options",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
