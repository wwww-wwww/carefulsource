[project]
name = "vscarefulsource"
version = "6"
requires-python = ">3.12"
readme = "README.md"
dependencies = ["vapoursynth>=74"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "packaging", "meson", "ninja", "wheel", "vapoursynth>=74"]

[tool.hatch.build.targets.wheel]
include = ["vapoursynth/plugins"]
artifacts = [
    "vapoursynth/plugins/*.dylib",
    "vapoursynth/plugins/*.so",
    "vapoursynth/plugins/*.dll",
]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "subprojects/*.wrap",
  "subprojects/packagefiles",
  "subprojects/lcms2-*",
  "subprojects/libjpeg-turbo-*",
  "subprojects/libpng-*",
  "subprojects/zlib-*",
  "meson.build",
  "meson.options",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.cibuildwheel]
archs = ["auto64"]

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.13" }
